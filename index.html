<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eee9dd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Carcassonne - UFF</title>
    <script>
      (() => {
        const stored = localStorage.getItem('carcassonne-theme')
        const theme = stored === 'dark' || stored === 'light'
          ? stored
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#171712' : '#eee9dd')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
